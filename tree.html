<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Ti — Interactive Catalog Tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #ccff00;
            --text-color: #c5c6c7;
            --text-light: #ffffff;
            --border-color: #45f3ff33;
            --glass-bg: rgba(31, 40, 51, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

@font-face {
            font-family: 'Sakana-Regular';
            src: url('https://cdn.shopify.com/s/files/1/0842/8362/1657/files/Sakana-Regular.woff2?v=1760518366.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) var(--bg-color);
            font-family: 'Sakana-Regular', sans-serif !important;
        }

        body {
            font-family: 'Sakana-Regular', sans-serif !important;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(204, 255, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(69, 243, 255, 0.05) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section h1 {
            font-size: 1.8rem;
            color: var(--text-light);
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-section h1 span {
            color: var(--accent-color);
        }

        .logo-section p {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.2rem;
        }

        .search-container {
            position: relative;
            width: 350px;
        }

        .search-container input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 2.8rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-light);
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.15);
        }

        .search-container svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            fill: #666;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex-grow: 1;
            height: calc(100vh - 90px);
            overflow: hidden;
        }

        .sidebar {
            background: rgba(11, 12, 16, 0.5);
            border-right: 1px solid var(--glass-border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 0.8rem;
        }

        .brand-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .brand-item {
            padding: 0.7rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }

        .brand-item:hover, .brand-item.active {
            background: rgba(204, 255, 0, 0.08);
            border-color: rgba(204, 255, 0, 0.2);
            color: var(--text-light);
        }

        .brand-item.active {
            font-weight: 600;
        }

        .brand-item .count {
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            color: var(--accent-color);
        }

        .content-area {
            padding: 2.5rem;
            overflow-y: auto;
            position: relative;
        }

        .stats-banner {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(204, 255, 0, 0.25);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .stat-card .value span {
            color: var(--accent-color);
        }

        .tree-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
        }

        .tree-node {
            margin-left: 1.5rem;
            position: relative;
        }

        .tree-node::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .tree-node:last-child::before {
            height: 15px;
        }

        .node-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            cursor: pointer;
            user-select: none;
        }

        .node-header:hover .node-title {
            color: var(--accent-color);
        }

        .node-title {
            font-weight: 600;
            color: var(--text-light);
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        .node-arrow {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .node-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .category-node {
            margin-left: 2rem;
            margin-top: 0.3rem;
            margin-bottom: 0.8rem;
        }

        .category-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 0.8rem;
            margin-left: 0.5rem;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .product-card:hover {
            border-color: rgba(204, 255, 0, 0.3);
            background: rgba(204, 255, 0, 0.03);
            transform: translateX(4px);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            max-width: 85%;
        }

        .product-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-light);
            white-space: normal;
            word-break: break-word;
        }

        .product-id {
            font-family: 'Sakana-Regular', sans-serif !important;
            font-size: 0.75rem;
            color: #666;
        }

        .shared-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 210, 0, 0.15);
            border: 1px solid rgba(255, 210, 0, 0.45);
            color: #ffd200;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            white-space: nowrap;
        }
        .shared-badge svg {
            width: 9px;
            height: 9px;
            fill: #ffd200;
            flex-shrink: 0;
        }
        .info-badge {
            display: inline-flex;
            align-items: center;
            gap: 3.5px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.45);
            color: #00d2ff;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            white-space: nowrap;
        }
        .info-badge svg {
            width: 9px;
            height: 9px;
            fill: #00d2ff;
            flex-shrink: 0;
        }
        .product-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .product-link:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .product-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive Mobile Layout adjustments */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 220px 1fr;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1.2rem;
                align-items: stretch;
            }

            .search-container {
                width: 100%;
            }

            .main-layout {
                display: flex;
                flex-direction: column;
                height: auto;
                overflow: visible;
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                max-height: 250px;
                padding: 1rem;
                overflow-y: scroll;
            }

            .content-area {
                padding: 1.2rem;
                height: auto;
                overflow: visible;
            }

            .tree-container {
                padding: 1.2rem;
            }

            .tree-node {
                margin-left: 0.8rem;
            }

            .category-node {
                margin-left: 1rem;
            }

            .product-grid {
                grid-template-columns: 1fr;
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .logo-section h1 {
                font-size: 1.4rem;
            }

            .stat-card .value {
                font-size: 1.8rem;
            }

            .node-title {
                font-size: 0.95rem;
            }
        }

        /* Tree control buttons */
        .tree-controls {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            justify-content: flex-end;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-light);
            background: rgba(204, 255, 0, 0.05);
        }

        .control-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>

","name":"Mini R56 JCW Style Rear Diffuser + GT-Wing","handle":"mini-r56-jcw-style-rear-diffuser-gt-wing"}],"Kits":[{"id":"10769084219673","name":"Mini R56 ETi W-1 Carbon Body Kit","handle":"mini-r56-eti-w1-carbon-body-kit"}]},"Gen 3 (F55 / F56)":{"Exterior":[{"id":"10769084023065","name":"Mini F55/F56 ETi Carbon Diffuser Set","handle":"mini-f55-f56-eti-carbon-diffuser-set"},{"id":"10769084088601","name":"Mini F55/F56 ETi W-1 Fender Trim Set","handle":"mini-f55-f56-eti-w1-fender-trim-set"}],"Kits":[{"id":"10769083990297","name":"Mini F55/F56 Duell AG Style Body Kit","handle":"mini-f55-f56-duell-ag-style-body-kit"}]}}};

        // Initialize App
        const brandListContainer = document.getElementById('brand-list-container');
        const treeRoot = document.getElementById('tree-root');
        const globalSearch = document.getElementById('global-search');
        let activeBrand = 'BMW';

        // Calculate counts
        function getBrandProductCount(brand) {
            let count = 0;
            if (!treeData[brand]) return 0;
            Object.keys(treeData[brand]).forEach(model => {
                Object.keys(treeData[brand][model]).forEach(cat => {
                    count += treeData[brand][model][cat].length;
                });
            });
            return count;
        }

        // Render Sidebar
        function renderSidebar() {
            // Brand display name overrides (data key → display label)
            const brandDisplayNames = {
                'Other Models': 'Chevrolet & Isuzu'
            };

            brandListContainer.innerHTML = '';
            Object.keys(treeData).forEach(brand => {
                const count = getBrandProductCount(brand);
                const displayBrand = brandDisplayNames[brand] || brand;
                const li = document.createElement('li');
                li.className = `brand-item ${brand === activeBrand ? 'active' : ''}`;
                li.innerHTML = `
                    <span>${displayBrand}</span>
                    <span class="count">${count}</span>
                `;
                li.addEventListener('click', () => {
                    document.querySelectorAll('.brand-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    activeBrand = brand;
                    renderTree();
                });
                brandListContainer.appendChild(li);
            });
        }

        // Render Tree for active brand
        function renderTree() {
            treeRoot.innerHTML = '';
            const models = treeData[activeBrand];
            if (!models) return;

            Object.keys(models).forEach(model => {
                const modelNode = document.createElement('div');
                modelNode.className = 'tree-node';

                // Header
                const header = document.createElement('div');
                header.className = 'node-header';
                header.innerHTML = `
                    <svg class="node-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    <span class="node-title">${model}</span>
                `;

                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'node-children';

                header.addEventListener('click', () => {
                    const arrow = header.querySelector('.node-arrow');
                    arrow.classList.toggle('collapsed');
                    childrenContainer.classList.toggle('hidden');
                });

                // Add Categories
                Object.keys(models[model]).forEach(cat => {
                    // Brand-specific category display name overrides
                    const categoryDisplayNames = {
                        'Universal Hardware & Accessories': {
                            'Other': 'Titanium and Interior'
                        },
                        'Universal Engine & Swap Parts': {
                            'Other': 'Manifolds & Cover'
                        }
                    };
                    const displayCat = (categoryDisplayNames[activeBrand] && categoryDisplayNames[activeBrand][cat])
                        ? categoryDisplayNames[activeBrand][cat]
                        : cat;

                    const catNode = document.createElement('div');
                    catNode.className = 'category-node';
                    catNode.innerHTML = `
                        <div class="category-title">
                            <span>//</span> ${displayCat}
                        </div>
                    `;

                    const grid = document.createElement('div');
                    grid.className = 'product-grid';

                    models[model][cat].forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        const sharedBadge = p.shared
                            ? `<span class="shared-badge">
                                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 18 8a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A2.99 2.99 0 0 0 6 9a3 3 0 0 0 0 6c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a3 3 0 1 0 3-3z"/></svg>
                                Shared · ${p.sharedNote}
                              </span>`
                            : '';
                        const infoBadge = p.note
                            ? `<span class="info-badge">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                ${p.note}
                               </span>`
                            : '';
                        card.innerHTML = `
                            <div class="product-info">
                                <span class="product-name" title="${p.name}">${p.name}</span>
                                <span class="product-id">ID: ${p.id}</span>
                                ${sharedBadge}
                                ${infoBadge}
                            </div>
                            <div class="product-actions" style="display: flex; gap: 6px; align-items: center;">
                                ${p.handle ? `<a href="https://myeliteti.myshopify.com/products/${p.handle}" target="_blank" class="product-link storefront-link" title="View Storefront Page (/products/${p.handle})">
                                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                </a>` : ''}
                                <a href="https://myeliteti.myshopify.com/admin/products/${p.id}" target="_blank" class="product-link admin-link" title="Open in Shopify Admin">
                                    <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                                </a>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    catNode.appendChild(grid);
                    childrenContainer.appendChild(catNode);
                });

                modelNode.appendChild(header);
                modelNode.appendChild(childrenContainer);
                treeRoot.appendChild(modelNode);
            });
        }

        // Global Search Functionality
        globalSearch.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderTree();
                return;
            }

            treeRoot.innerHTML = '';
            Object.keys(treeData).forEach(brand => {
                const models = treeData[brand];
                Object.keys(models).forEach(model => {
                    let matchedProducts = [];
                    Object.keys(models[model]).forEach(cat => {
                        const matches = models[model][cat].filter(p => 
                            p.name.toLowerCase().includes(query) || p.id.includes(query)
                        );
                        if (matches.length > 0) {
                            matchedProducts.push({ cat, matches });
                        }
                    });

                    if (matchedProducts.length > 0) {
                        const modelNode = document.createElement('div');
                        modelNode.className = 'tree-node';
                        modelNode.innerHTML = `
                            <div class="node-header">
                                <span class="node-title">${brand} ➡️ ${model}</span>
                            </div>
                        `;
                        const container = document.createElement('div');
                        container.className = 'node-children';

                        matchedProducts.forEach(group => {
                            const catNode = document.createElement('div');
                            catNode.className = 'category-node';
                            catNode.innerHTML = `<div class="category-title">// ${group.cat}</div>`;
                            
                            const grid = document.createElement('div');
                            grid.className = 'product-grid';

                            group.matches.forEach(p => {
                                const card = document.createElement('div');
                                card.className = 'product-card';
                                card.innerHTML = `
                                    <div class="product-info">
                                        <span class="product-name" title="${p.name}">${p.name}</span>
                                        <span class="product-id">ID: ${p.id}</span>
                                    </div>
                                    <a href="https://myeliteti.myshopify.com/admin/products/${p.id}" target="_blank" class="product-link">
                                        <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                                    </a>
                                `;
                                grid.appendChild(card);
                            });
                            catNode.appendChild(grid);
                            container.appendChild(catNode);
                        });
                        modelNode.appendChild(container);
                        treeRoot.appendChild(modelNode);
                    }
                });
            });
        });

        // Expand / Collapse All Event Handlers
        document.getElementById('btn-expand-all').addEventListener('click', () => {
            document.querySelectorAll('.node-arrow').forEach(arrow => {
                arrow.classList.remove('collapsed');
            });
            document.querySelectorAll('.node-children').forEach(container => {
                container.classList.remove('hidden');
            });
        });

        document.getElementById('btn-collapse-all').addEventListener('click', () => {
            document.querySelectorAll('.node-arrow').forEach(arrow => {
                arrow.classList.add('collapsed');
            });
            document.querySelectorAll('.node-children').forEach(container => {
                container.classList.add('hidden');
            });
        });

        // Load App
        renderSidebar();
        renderTree();
    </script>
</body>
</html>

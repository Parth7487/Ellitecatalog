<html lang="en">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-yellow: #d4ff00;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --success-green: #10b981;
            --button-blue: #0284c7;
            --button-green: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            min-height: 100vh;
        }

        header {
            max-width: 1600px;
            margin: 0 auto 2rem auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--accent-yellow);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 0.25rem;
        }

        .badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Tabs Container Style */
        .tabs-container {
            max-width: 1600px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            gap: 1rem;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .tab-btn.active {
            background: var(--accent-yellow);
            color: #000000;
            border-color: var(--accent-yellow);
        }

        /* ─── Sort / Filter Bar ─── */
        .sort-bar {
            max-width: 1600px;
            margin: 0.75rem auto 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            padding: 0.65rem 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }
        .sort-bar-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-right: 0.25rem;
        }
        .sort-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.35rem 0.9rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .sort-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .sort-btn.active {
            background: rgba(212,255,0,0.18);
            color: var(--accent-yellow);
            border-color: rgba(212,255,0,0.5);
        }
        .sort-divider {
            width: 1px;
            height: 22px;
            background: var(--border-color);
            margin: 0 0.2rem;
        }
        #search-input {
            margin-left: auto;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            color: #fff;
            padding: 0.38rem 0.85rem;
            font-size: 0.85rem;
            width: 220px;
            outline: none;
            transition: border-color 0.18s;
        }
        #search-input::placeholder { color: rgba(255,255,255,0.3); }
        #search-input:focus { border-color: var(--accent-yellow); }

        main {
            max-width: 1600px;
            margin: 0 auto;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background: rgba(0, 0, 0, 0.25);
            padding: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        /* Parent Row Style */
        tr.parent-row {
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
        }
        
        tr.parent-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Component (Child) Row Style */
        tr.child-row {
            background: rgba(0, 0, 0, 0.15);
        }

        tr.child-row td {
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Carbon-Only Highlight Style */
        tr.carbon-only-row {
            background: rgba(212, 255, 0, 0.03);
        }

        /* Duplicate Component Highlight Style */
        tr.duplicate-component-row {
            background: rgba(14, 165, 233, 0.15) !important;
            border-left: 4px solid #38bdf8;
        }
        
        .duplicate-badge {
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(14, 165, 233, 0.4);
            display: inline-block;
            margin-top: 0.25rem;
        }

        /* ─── Tab Count Badge ─── */
        .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.65);
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 1.4rem;
            height: 1.4rem;
            padding: 0 0.35rem;
            border-radius: 999px;
            margin-left: 0.45rem;
            vertical-align: middle;
            letter-spacing: 0.02em;
            transition: background 0.2s, color 0.2s;
        }
        .tab-btn.active .tab-count {
            background: rgba(0,0,0,0.35);
            color: #0b0f19;
        }

        .carbon-only-badge {
            background: rgba(212, 255, 0, 0.15);
            color: var(--accent-yellow);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(212, 255, 0, 0.3);
            display: inline-block;
            margin-top: 0.25rem;
        }

        /* ─── Supra Section Highlighting ─── */
        .supra-parent-row {
            background: rgba(251, 146, 60, 0.09) !important;
            border-left: 4px solid #f97316;
        }
        .supra-child-row {
            background: rgba(251, 146, 60, 0.04) !important;
            border-left: 4px solid rgba(249, 115, 22, 0.35);
        }
        .supra-badge {
            background: rgba(249, 115, 22, 0.18);
            color: #fb923c;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            border: 1px solid rgba(249, 115, 22, 0.4);
            display: inline-block;
            margin-left: 0.5rem;
            vertical-align: middle;
            letter-spacing: 0.04em;

            color: var(--text-secondary);
            width: 40px;
            text-align: center;
        }

            color: #38bdf8;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;

            color: var(--text-secondary);
            margin-top: 0.2rem;

            color: var(--text-secondary);
            margin-top: 0.25rem;

            color: var(--text-secondary);
            line-height: 1.4;
        }

            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;

            border: 1px solid var(--button-blue);
            color: #38bdf8;
        }

            background: var(--button-blue);
            color: #ffffff;

            background: rgba(22, 163, 74, 0.2);
            border: 1px solid var(--button-green);
            color: #4ade80;
        }

        .btn-action.admin:hover {
            background: var(--button-green);
            color: #ffffff;
        }

        tr.section-divider td {
            border-bottom: 2px solid var(--border-color);
            height: 1px;
            padding: 0;
        }

</head>

        <button class="sort-btn" id="sort-extra" onclick="setSort('extra')">🟡 Extra First</button>
        <div class="sort-divider"></div>
        <span class="sort-bar-label" style="margin-left:0.1rem">Filter:</span>
        <button class="sort-btn" id="filter-issues" onclick="toggleIssuesOnly()" title="Show only products with missing, extra, or price-mismatch issues">⚠️ Issues Only</button>
        <div class="sort-divider"></div>
        <input type="text" id="search-input" placeholder="🔍  Search title / model…" oninput="populateTable()">
    </div>
    <!-- ─── Stats Bar ─── -->
    <div id="stats-bar" style="max-width:1600px;margin:0.5rem auto 0.75rem auto;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;font-size:0.82rem;color:var(--text-secondary);"></div>

                        let currentSort = 'default';
        let issuesOnly = false;

        function setSort(mode) {
            currentSort = mode;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (!btn.id || !btn.id.startsWith('sort-')) return;
                btn.classList.remove('active');
            });
            const btn = document.getElementById('sort-' + mode);
            if (btn) btn.classList.add('active');
            populateTable();
        }

        function toggleIssuesOnly() {
            issuesOnly = !issuesOnly;
            const btn = document.getElementById('filter-issues');
            if (issuesOnly) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            populateTable();
        }

        function hasMissing(p) {
            return p.components.some(c => c.name && c.name.includes('Missing on Shopify'));
        }
        function hasExtra(p) {
            return p.components.some(c => c.name && c.name.includes('Extra on Shopify'));
        }
        function hasPriceDiff(p) {
            // price diff badges are embedded in live_base HTML as <span class='badge'...>(+$X)</span>
            return p.components.some(c => c.live_base && c.live_base.includes('<span') && c.live_base.includes('badge'));
        }
        function hasAnyIssue(p) {
            return hasMissing(p) || hasExtra(p) || hasPriceDiff(p);
        }

        function switchMake(make) {
            currentMake = make;
            // Reset issues-only filter when switching make
            // (keep issuesOnly state intentionally — user may want to keep filtering)

            // Toggle active styling using data-make attribute (innerText breaks with count badges)
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.make === make) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            populateTable();
        }

        function populateTable() {
            const tbody = document.getElementById('audit-table-body');
            tbody.innerHTML = '';

            const filtered = productsData.filter(p => {
                if (currentMake === 'Mazda') return p.make.toLowerCase().includes('mazda');
                if (currentMake === 'BMW') return p.make.toLowerCase().includes('bmw');
                if (currentMake === 'Benz') return p.make.toLowerCase().includes('mercedes') || p.make.toLowerCase().includes('benz');
                if (currentMake === 'Honda') return p.make.toLowerCase().includes('honda');
                if (currentMake === 'Mitsubishi') return p.make.toLowerCase().includes('mitsubishi');
                if (currentMake === 'Toyota') return p.make.toLowerCase().includes('toyota') || p.make.toLowerCase().includes('lexus') || p.make.toLowerCase().includes('veilfire') || p.make.toLowerCase().includes('alphard') || p.make.toLowerCase().includes('majesty');
                if (currentMake === 'Nissan') return p.make.toLowerCase().includes('nissan');
                if (currentMake === 'Porsche') return p.make.toLowerCase().includes('porsche');
                return false;
            });

            // Apply search filter
            const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
            let displayed = searchVal
                ? filtered.filter(p =>
                    p.title.toLowerCase().includes(searchVal) ||
                    (p.model || '').toLowerCase().includes(searchVal) ||
                    (p.style || '').toLowerCase().includes(searchVal)
                  )
                : filtered;

            // Apply issues-only filter
            if (issuesOnly) {
                displayed = displayed.filter(p => hasAnyIssue(p));
            }

            // ─── Update stats bar ───
            const statsBar = document.getElementById('stats-bar');
            if (statsBar) {
                const total = displayed.length;
                const missingCount = displayed.filter(hasMissing).length;
                const extraCount = displayed.filter(hasExtra).length;
                const priceDiffCount = displayed.filter(hasPriceDiff).length;
                const cleanCount = displayed.filter(p => !hasAnyIssue(p)).length;
                statsBar.innerHTML = [
                    `<span style="color:#fff;font-weight:600">${total} products</span>`,
                    missingCount  ? `<span style="color:#ef4444">🔴 ${missingCount} missing component${missingCount>1?'s':''}</span>` : '',
                    extraCount    ? `<span style="color:#f59e0b">🟡 ${extraCount} with extra${extraCount>1?'s':''}</span>` : '',
                    priceDiffCount? `<span style="color:#fb923c">💰 ${priceDiffCount} price mismatch${priceDiffCount>1?'es':''}</span>` : '',
                    cleanCount    ? `<span style="color:#10b981">✅ ${cleanCount} clean</span>` : '',
                ].filter(Boolean).join('<span style="color:rgba(255,255,255,0.15)"> │ </span>');
            }

            // Apply sort
            if (currentSort === 'az') {
                displayed = [...displayed].sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentSort === 'price-diff') {
                displayed = [...displayed].sort((a, b) => {
                    const aHas = hasPriceDiff(a) ? 0 : 1;
                    const bHas = hasPriceDiff(b) ? 0 : 1;
                    return aHas - bHas;
                });
            } else if (currentSort === 'missing') {
                displayed = [...displayed].sort((a, b) => {
                    const aHas = hasMissing(a) ? 0 : 1;
                    const bHas = hasMissing(b) ? 0 : 1;
                    return aHas - bHas;
                });
            } else if (currentSort === 'extra') {
                displayed = [...displayed].sort((a, b) => {
                    const aHas = hasExtra(a) ? 0 : 1;
                    const bHas = hasExtra(b) ? 0 : 1;
                    return aHas - bHas;
                });
            }

            const isSupra = (p) => p.title.toLowerCase().includes('supra') || p.handle.toLowerCase().includes('supra') || (p.model && p.model.toLowerCase().includes('supra'));

            displayed.forEach((p, idx) => {
                // 1. Render Parent Row
                const parentTr = document.createElement('tr');
                const supraHighlight = (currentMake === 'Toyota' && isSupra(p));
                parentTr.className = supraHighlight ? 'parent-row supra-parent-row' : 'parent-row';
                parentTr.innerHTML = `
                    <td class="col-index">${idx + 1}</td>
                    <td>
                        <span class="category-tag">${p.category}</span>
                        ${supraHighlight ? '<span class="supra-badge">🏎 SUPRA</span>' : ''}
                        <div style="font-size: 0.85rem; margin-top: 0.25rem; color: var(--text-secondary);">${p.make}</div>
                    </td>
                    <td>
                        <div class="make-model-spec">${p.title}</div>
                        <div class="title-sub">Handle: \`${p.handle}\`</div>
                        <div style="font-size: 0.8rem; font-family: monospace; color: var(--accent-yellow); margin-top: 0.2rem;">ID: ${p.id}</div>
                        ${p.notes ? `<div style="font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 0.4rem; margin-top: 0.4rem; color: #38bdf8;">${p.notes}</div>` : ''}
                    </td>
                    <td colspan="3" style="color: var(--text-secondary); font-size: 0.85rem;">
                        ${p.components.length} components configured
                    </td>
                    <td>
                        <div class="actions-cell">
                            <a href="https://myeliteti.com/products/${p.handle}" target="_blank" class="btn-action preview">👁️ Preview</a>
                            <a href="https://admin.shopify.com/store/myeliteti/products/${p.id}" target="_blank" class="btn-action admin">⚙️ Admin</a>
                        </div>
                    </td>
                `;
                tbody.appendChild(parentTr);

                // 2. Render Child Component Rows
                // Count occurrences of each component name to check for duplicates
                const compCounts = {};
                p.components.forEach(comp => {
                    const nameLower = (comp.name || '').toLowerCase().trim();
                    compCounts[nameLower] = (compCounts[nameLower] || 0) + 1;
                });

                p.components.forEach((c) => {
                    const childTr = document.createElement('tr');
                    const isDuplicate = (compCounts[(c.name || '').toLowerCase().trim()] > 1) || c.is_duplicate;
                    const isMissing = c.is_missing || c.live_base === 'N/A';
                    
                    let childClass = c.is_carbon_only ? 'child-row carbon-only-row' : 'child-row';
                    if (isDuplicate) {
                        childClass += ' has-duplicate';
                    }
                    const hasMismatch = c.live_base && c.live_base.includes('Mismatch');
                    if (hasMismatch) {
                        childClass += ' status-red-row';
                    }
                    if (supraHighlight) childClass += ' supra-child-row';
                    childTr.className = childClass;
                    childTr.innerHTML = `
                        <td></td>
                        <td style="color: var(--text-secondary); font-size: 0.85rem; text-align: right; padding-right: 1.5rem;">
                            ↳ Component
                        </td>
                        <td>
                            <div style="font-weight: 600; color: #ffffff;">${c.name}</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.15rem;">
                                Model spec: ${p.model} ${p.style}
                            </div>
                            ${isDuplicate && !isMissing ? '<span class="duplicate-badge">⚠️ DUPLICATE COMPONENT OPTION DETECTED</span>' : ''}
                            ${isMissing ? '<span class="missing-badge" style="background:#0284c7;color:white;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:bold;display:inline-block;margin-top:4px;">🔵 MISSING ON SHOPIFY</span>' : ''}
                            ${c.is_carbon_only && !isDuplicate && !isMissing ? '<span class="carbon-only-badge">⚡ CARBON ONLY (NO FRP)</span>' : ''}
                        </td>
                        <td class="price-csv">${c.csv_price}</td>
                        <td class="price-live">${c.live_base}</td>
                        <td class="variants-list" colspan="2">${c.variants}</td>
                    `;
                    tbody.appendChild(childTr);
                });

                // 3. Divider Row
                const dividerTr = document.createElement('tr');
                dividerTr.className = 'section-divider';
                dividerTr.innerHTML = `<td colspan="7"></td>`;
                tbody.appendChild(dividerTr);
            });
        }
        // ─── Inject product counts into tab pills ───
        function initTabCounts() {
            const makeFilters = {
                'Mazda':       p => p.make.toLowerCase().includes('mazda'),
                'BMW':         p => p.make.toLowerCase().includes('bmw'),
                'Benz':        p => p.make.toLowerCase().includes('mercedes') || p.make.toLowerCase().includes('benz'),
                'Honda':       p => p.make.toLowerCase().includes('honda'),
                'Mitsubishi':  p => p.make.toLowerCase().includes('mitsubishi'),
                'Toyota':      p => p.make.toLowerCase().includes('toyota') || p.make.toLowerCase().includes('lexus') || p.make.toLowerCase().includes('veilfire') || p.make.toLowerCase().includes('alphard') || p.make.toLowerCase().includes('majesty'),
                'Nissan':      p => p.make.toLowerCase().includes('nissan'),
                'Porsche':     p => p.make.toLowerCase().includes('porsche'),
            };
            document.querySelectorAll('.tab-btn').forEach(btn => {
                // Use data-make attribute for reliable matching (innerText includes child text)
                const make = btn.dataset.make;
                const filterFn = make ? makeFilters[make] : null;
                if (!filterFn) return;
                const makeProducts = productsData.filter(filterFn);
                const count = makeProducts.length;
                const issueCount = makeProducts.filter(hasAnyIssue).length;
                // Remove any existing count badge first
                const existing = btn.querySelector('.tab-count');
                if (existing) existing.remove();
                const existingDot = btn.querySelector('.tab-issue-dot');
                if (existingDot) existingDot.remove();
                const badge = document.createElement('span');
                badge.className = 'tab-count';
                badge.textContent = count;
                btn.appendChild(badge);
                // Show red dot if there are issues in this make
                if (issueCount > 0) {
                    const dot = document.createElement('span');
                    dot.className = 'tab-issue-dot';
                    dot.title = `${issueCount} product${issueCount>1?'s':''} with issues`;
                    dot.style.cssText = 'display:inline-block;width:7px;height:7px;background:#ef4444;border-radius:50%;margin-left:4px;vertical-align:middle;flex-shrink:0;';
                    btn.appendChild(dot);
                }
            });
        }
        initTabCounts();
        document.getElementById('total-product-count').textContent = productsData.length;
        populateTable();
    </script>
</body>
</html>
